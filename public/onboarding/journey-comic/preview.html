<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xmission</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#151b19;color:#f1e7d4;font-family:system-ui,"Microsoft YaHei",sans-serif}body{overflow:hidden}.picture{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#151b19}header{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:20px 28px;background:linear-gradient(#13181388,transparent);pointer-events:none}.brand{font:20px Georgia,serif;text-shadow:0 2px 8px #000}.count{font-size:12px;color:#f1e7d4d0;text-shadow:0 1px 5px #000}nav{position:absolute;inset:auto 0 0;display:flex;justify-content:center;align-items:center;gap:14px;padding:18px;background:linear-gradient(transparent,#101713b0)}button{background:#18201acc;color:#f1e7d4;border:1px solid #c6b69155;border-radius:5px;padding:9px 18px;cursor:pointer;font:inherit;font-size:13px;min-height:40px}button:hover{background:#3b4937d9}button:focus-visible{outline:2px solid #dfbd83;outline-offset:3px}button:disabled{opacity:.35;cursor:default}.dots{display:flex;gap:7px;position:absolute;bottom:81px;left:50%;transform:translateX(-50%)}.dots button{padding:0;min-height:7px;height:7px;width:7px;border-radius:100%;background:#ece2cf88;border:0;box-shadow:0 1px 5px #0008}.dots button[aria-current=true]{background:#fff5dc;transform:scale(1.4)}.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 20px;background:#17231ce6;border-radius:6px;font-size:14px;display:none}.loading.visible{display:block}@media(max-width:600px){header{padding:16px}nav{gap:8px;padding:12px}.dots{gap:5px;bottom:72px}button{padding:8px 13px}}
.scene{position:absolute;inset:0;isolation:isolate;z-index:0}.picture{pointer-events:none}#picture-next{opacity:0}header,nav,.dots,.loading{z-index:1}
.music-toggle{pointer-events:auto;font:inherit;font-size:12px;padding:4px 8px;min-height:28px;border:0;background:#18201a90}.caption{position:absolute;left:8%;right:8%;bottom:102px;margin:0;text-align:center;color:#fff3dd;font:400 clamp(18px,2vw,24px)/1.6 SimSun,serif;letter-spacing:.065em;text-shadow:0 2px 4px #000,0 0 18px #000;background:linear-gradient(90deg,transparent,#11181455 25%,#11181455 75%,transparent);padding:10px 18px;z-index:1;pointer-events:none}</style></head>
<body><div class="scene"><img class="picture" id="picture" alt=""><img class="picture" id="picture-next" alt="" aria-hidden="true"></div><header><span class="brand">Xmission</span><div style="display:flex;align-items:center;gap:16px"><button id="music-toggle" class="music-toggle" aria-pressed="true">音乐开</button><span class="count" id="count"></span></div></header><audio id="music" src="./score/devils-love-09.mp3" preload="auto"></audio><p id="caption" class="caption" aria-live="polite"></p><div id="loading" class="loading" role="status">图片正在展开…</div><div class="dots" id="dots" aria-label="旅行画面"></div><nav aria-label="图片叙事控制"><button id="previous">上一张</button><button id="play">暂停</button><button id="next">下一张</button></nav>
<script type="module" src="./player.js"></script></body></html>
